name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build-msvc -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-msvc

      # The ROM-hack converter (AkiMods tools/romhack) ships as tools\romhack next to the exe, where Import looks
      # first. `ref` is the AkiMods tag this launcher release goes with: push that tag before the launcher's, bump it per release.
      - name: Checkout AkiMods (converter)
        uses: actions/checkout@v4
        with:
          repository: jessetbh/AkiMods
          ref: v0.3.0
          path: _akimods

      - name: Package
        shell: pwsh
        run: .\tools\package.ps1 -Version ${{ github.ref_name }} -SkipBuild -ConverterTools _akimods\tools\romhack

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
